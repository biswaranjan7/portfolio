<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#03040A" stroke="url(#cosmicGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4 4" />
  
  <!-- Orbital Ring -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#cosmicGrad)" stroke-width="1.5" transform="rotate(-25 50 50)" />
  
  <!-- Glowing Center Star -->
  <circle cx="50" cy="50" r="8" fill="url(#starGlow)" />
  
  <!-- Stylized Monogram BM -->
  <text x="50" y="56" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="900" fill="#F5F7FF" text-anchor="middle" letter-spacing="1">BM</text>
</svg>
